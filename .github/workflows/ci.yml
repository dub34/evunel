name: CI
on: [push, pull_request]
# Theme Check reports its results as a check run, which needs write access to checks.
# New repositories give GITHUB_TOKEN read-only access by default.
permissions:
  contents: read
  checks: write
jobs:
  # Lighthouse runs against a live store and needs store secrets.
  # It will be added back in the QA phase once the store credentials exist.
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}

  # Every commit must follow Conventional Commits (see commitlint.config.mjs).
  # The local husky hook can be skipped, so CI checks the same rules again.
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check pull request commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Check pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A new branch has no previous commit; check only its latest commit then.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi
