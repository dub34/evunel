name: CI
on: [push, pull_request]
# Theme Check reports its results as a check run, which needs write access to checks.
# New repositories give GITHUB_TOKEN read-only access by default.
permissions:
  contents: read
  checks: write
jobs:
  # Lighthouse runs against a live store and needs store secrets.
  # It will be added back in the QA phase once the store credentials exist.
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
